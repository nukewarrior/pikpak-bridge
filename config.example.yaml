server:
  listen: 0.0.0.0:8080

database:
  path: /data/pikpak-bridge.db

pikpak:
  session_dir: /data/sessions
  quota_refresh: 5m
  status_interval: 10s
  min_free_space: 2GB
  accounts:
    - id: pp01
      name: PikPak 01
      username: ${PIKPAK_PP01_USERNAME}
      password: ${PIKPAK_PP01_PASSWORD}
      max_jobs: 2
    - id: pp02
      name: PikPak 02
      username: ${PIKPAK_PP02_USERNAME}
      password: ${PIKPAK_PP02_PASSWORD}
      max_jobs: 2

aria2:
  status_interval: 5s
  instances:
    - id: unraid
      name: Unraid
      url: http://192.168.1.10:6800/jsonrpc
      secret: ${ARIA2_UNRAID_SECRET}
    - id: backup
      name: Backup
      url: http://192.168.1.20:6800/jsonrpc
      secret: ${ARIA2_BACKUP_SECRET}

targets:
  - id: movies
    name: 电影
    aria2_instance: unraid
    dir: /downloads/movies
    # local_dir: /nas/downloads/movies  # 对应宿主 NAS 挂载，用于校验后安全替换
    default: true
  - id: tv
    name: 电视剧
    aria2_instance: unraid
    dir: /downloads/tv
  - id: temp
    name: 临时下载
    aria2_instance: backup
    dir: /downloads/temp

scheduler:
  worker_interval: 2s
  retry_interval: 30s
  max_retry: 10
  account_failure_threshold: 3
  account_cooldown: 30m

cleanup:
  enabled: true
  permanent: true
  verify_size: true
  delay: 60s
